<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAS-PROVA | Avaliação</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#16283c;background:#f2f6f7}body{margin:0}.wrap{max-width:760px;margin:32px auto;padding:0 15px}.box{background:white;border:1px solid #dae4e5;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 3px 18px #173b4010}h1{color:#315b4e;margin:0 0 8px}h2{font-size:1.2rem}label{display:block;margin:12px 0}input[type=text]{box-sizing:border-box;width:100%;padding:12px;border:1px solid #a9b9bd;border-radius:8px;font-size:1rem}button{background:#365a50;color:white;border:0;border-radius:8px;padding:13px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#627385}.option{padding:10px;border:1px solid #e1e8e8;border-radius:9px;cursor:pointer}.option input{margin-right:10px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.timer{font-weight:700;font-variant-numeric:tabular-nums}.error{color:#a82020}#exam,#done{display:none}@media(max-width:500px){.box{padding:16px}.wrap{margin:10px auto}}
</style></head><body><main class="wrap"><div class="box"><div class="top"><h1>PAS-PROVA</h1><span class="timer" id="clock"></span></div><div class="muted" id="status">Carregando avaliação...</div></div>
<section class="box" id="identify"><h2 id="exam-title"></h2><p id="details"></p><p id="instructions"></p><label for="student">Nome completo do aluno *</label><input id="student" type="text" autocomplete="name" maxlength="150" placeholder="Nome e sobrenome"><p class="muted">A turma será preenchida automaticamente. O tempo começa ao tocar em Iniciar.</p><button id="start" disabled>Iniciar avaliação</button></section>
<section id="exam"><div id="questions"></div><div class="box"><button id="submit">Enviar respostas e encerrar</button><p class="muted">Após o envio, a tentativa será encerrada.</p></div></section><section class="box" id="done"><h2>Respostas recebidas</h2><p id="receipt"></p></section></main><script type="module" src="./assets/js/prova-interna.js"></script></body></html>
