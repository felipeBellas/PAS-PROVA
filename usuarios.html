<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gerenciar Usuários - PAS-PROVA</title>

  <script src="https://cdn.tailwindcss.com"></script>

<style>
/* PAS-PROVA — GERENCIAR USUÁRIOS */

body {
  background: #f1f5f9 !important;
  color: #0f172a !important;
}

/* Painéis e cartões */
.bg-slate-900,
.bg-slate-800,
.bg-slate-950 {
  background: #ffffff !important;
}

.bg-slate-700 {
  background: #e2e8f0 !important;
}

.border-slate-700,
.border-slate-800,
.border-slate-600 {
  border-color: #e2e8f0 !important;
}

/* Títulos */
h1,
.text-blue-500,
.text-blue-400 {
  color: #365a50 !important;
}

h2,
h3,
.text-white,
.text-slate-100,
.text-slate-200 {
  color: #0f172a !important;
}

/* Textos secundários */
.text-slate-300,
.text-slate-400,
.text-slate-500 {
  color: #64748b !important;
}

/* Botões principais */
.bg-blue-600,
.bg-blue-500 {
  background: #365a50 !important;
  color: #ffffff !important;
}

.hover\:bg-blue-500:hover,
.hover\:bg-blue-600:hover {
  background: #29463d !important;
}

/* Botões secundários */
button.bg-slate-700,
a.bg-slate-700 {
  background: #e2e8f0 !important;
  color: #334155 !important;
}

button.bg-slate-700:hover,
a.bg-slate-700:hover {
  background: #cbd5e1 !important;
}

/* Manter vermelho nas ações perigosas */
.bg-red-600,
.bg-red-700 {
  color: #ffffff !important;
}

/* Manter indicadores de situação */
.text-emerald-400,
.text-green-400 {
  color: #15803d !important;
}

/* Campos de edição */
input,
select,
textarea {
  background: #ffffff !important;
  color: #0f172a !important;
  border-color: #cbd5e1 !important;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #a9c5b8;
}

/* Links */
a:not([class*="bg-"]) {
  color: #365a50;
}
</style>

</head>


<body class="bg-slate-900 text-slate-100 p-6">

  <!-- =====================================================
       CONTEÚDO PROTEGIDO
       ===================================================== -->

  <div
    id="conteudo-usuarios"
    class="hidden max-w-5xl mx-auto space-y-8"
  >


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header
      class="
        flex
        flex-col
        sm:flex-row
        sm:justify-between
        sm:items-center
        gap-4
        border-b
        border-slate-800
        pb-4
      "
    >

      <div>

        <h1 class="text-2xl font-bold text-blue-500">
          Gerenciar Usuários
        </h1>

        <p class="text-xs text-slate-500 mt-1">
          PAS-PROVA • Administração
        </p>

      </div>


      <button
        id="btn-voltar-painel"
        type="button"
        class="
          bg-slate-700
          hover:bg-slate-600
          text-slate-200
          text-sm
          px-4
          py-2
          rounded
          transition
        "
      >
        Voltar ao Painel
      </button>

    </header>



    <!-- =====================================================
         INFORMAÇÕES
         ===================================================== -->

    <div
      class="
        bg-slate-800
        border
        border-slate-700
        rounded-xl
        p-5
      "
    >

      <h2 class="font-bold text-slate-200">
        Administração de contas
      </h2>

      <p class="text-sm text-slate-400 mt-2">
        Nesta área o administrador poderá visualizar e
        gerenciar os usuários autorizados a utilizar o
        PAS-PROVA.
      </p>

    </div>



    <!-- =====================================================
         USUÁRIOS
         ===================================================== -->

    <section
      class="
        bg-slate-800
        border
        border-slate-700
        rounded-xl
        p-6
      "
    >


      <div
        class="
          flex
          flex-col
          sm:flex-row
          sm:justify-between
          sm:items-center
          gap-3
          mb-5
        "
      >

        <div>

          <h2 class="text-xl font-bold text-slate-200">
            Usuários cadastrados
          </h2>

          <p
            id="total-usuarios"
            class="text-xs text-slate-500 mt-1"
          >
            Carregando...
          </p>

        </div>


        <button
          id="btn-atualizar-usuarios"
          type="button"
          class="
            bg-slate-700
            hover:bg-slate-600
            text-slate-200
            text-xs
            px-4
            py-2
            rounded
            transition
          "
        >
          Atualizar
        </button>

      </div>



      <!-- LISTA -->

      <div
        id="lista-usuarios"
        class="space-y-4"
      >

        <p class="text-slate-500">
          Carregando usuários...
        </p>

      </div>

    </section>


  </div>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script
    type="module"
    src="./assets/js/usuarios.js"
  ></script>

</body>

</html>
